version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eduflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduflow-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-syed}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-eduflow}
      SECRET_KEY: ${SECRET_KEY:-eduflow_super_secret_jwt_key_development_2026}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduflow-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      AUTH_SECRET: ${AUTH_SECRET:-eduflow_auth_secret_key_production_32_chars_long!}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
