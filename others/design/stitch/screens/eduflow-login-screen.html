<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24;
        }
        
        .bg-pattern {
            background-color: #f8f9ff;
            background-image: radial-gradient(rgba(30, 64, 175, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .shadow-soft {
            box-shadow: 0 4px 24px -4px rgba(30, 64, 175, 0.05), 0 2px 8px -2px rgba(30, 64, 175, 0.02);
        }

<body class="bg-pattern min-h-screen flex flex-col font-sans text-on-surface antialiased">
<!-- Top Navigation for Language Toggle -->
<header class="w-full flex justify-end p-margin absolute top-0 z-10">
<button class="flex items-center gap-xs text-on-surface-variant hover:text-primary transition-colors bg-surface-container-lowest/80 backdrop-blur-sm px-md py-sm rounded-full border border-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">translate</span>
<span class="font-label-md text-label-md">বাংলা / EN</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-md sm:p-lg">
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full max-w-[420px] rounded-xl shadow-soft border border-surface-container-highest p-margin relative overflow-hidden">
<!-- Logo & Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container/10 rounded-lg mb-lg">
<span class="material-symbols-outlined text-[32px] text-primary" data-weight="fill">school</span>
</div>
<h1 class="font-h2 text-h2 text-primary mb-sm">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your EduFlow account</p>
</div>
<!-- Login Form -->
<form class="space-y-lg">
<!-- Email Input -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">mail</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-[44px] pr-md py-[10px] focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md placeholder:text-outline" id="email" name="email" placeholder="admin@eduflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-[44px] pr-[44px] py-[10px] focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Submit -->
<div class="flex items-center mt-md mb-xl">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md py-md rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-sm active:scale-[0.98]" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-xl relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-highest"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-md bg-surface-container-lowest font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
</div>
</div>
<!-- Alternative Login (SSO placeholder) -->
<div class="mt-lg">
<button class="w-full bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md py-[10px] rounded-lg transition-colors flex items-center justify-center gap-sm" type="button">
<img alt="" class="w-5 h-5 object-contain" data-alt="A small, stylized icon representing a generic institutional single sign-on provider. The icon uses a minimalist flat design with subtle gradients of brand blue and white. Clean lines, professional corporate style, isolated on a transparent background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQpJkUmYfjEqP2NGEqousMDGp7lK-B9raKROq95ucq8rwqyB0TD9yW884TQBzQoCpZP8aLDfxBg-UHo6pjVb84r3aMYUblvKPJCFsPj3ln2asZCExURWIbz8qNxauSdv-ZI-MbLbNzrhEEW0mPky8GM7p7nAVnK9MpY6yB2eAVL3jTv5YvjSrYf-83oQoQFPajXpBb46mRjQApawMx7syshzxVBOygGvf46L5ODWGo0dIqHmWn_wVkm114BjoSXYxGR3TL45-KZ1dT"/>
                    Sign in with Institution SSO
                </button>
</div>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors ml-xs" href="#">Start free trial</a>
</p>
</div>
</div>
</main>
</body></html>
